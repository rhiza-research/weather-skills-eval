name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose run --rm --build test
      - uses: astral-sh/setup-uv@v10.3.2
        if: ${{ !cancelled() }}
      - if: ${{ !cancelled() }}
        run: uv run --isolated --no-project --with-requirements scripts/run-eval.py --with pytest pytest scripts/run-eval.py

  # The eval image batches run, tagged main and with the commit SHA.
  publish:
    if: ${{ github.event_name == 'push' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: eval
          push: true
          platforms: linux/amd64
          build-args: |
            HARNESS_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/rhiza-research/weather-skills-eval:main
            ghcr.io/rhiza-research/weather-skills-eval:${{ github.sha }}
