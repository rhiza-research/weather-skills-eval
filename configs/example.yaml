# A configuration for weather-skills-eval: the eval side of a run. Copy it,
# replace every TODO, and set the referenced ${...} variables in .env, except
# APP_IMAGE and RUNNER_IMAGE, which are chosen per batch (scripts/run-eval.py or
# docker compose run -e). Every secret is a ${...} reference. The model, skill
# packs, connections and tracked settings come from the configs repo commit.
image: ${APP_IMAGE}
# The image skills run on: the sandbox runner image the cluster runs. It is
# pulled on every run, whatever pull says.
runner_image: ${RUNNER_IMAGE}
# false runs the app image already on the Docker host instead of pulling it;
# scripts/run-eval.py pulls it first when asked.
pull: false
dataset: TODO
env:
  WEBUI_SECRET_KEY: ${APP_WEBUI_SECRET_KEY}
  BOOTSTRAP_ADMIN_EMAIL: TODO
  BOOTSTRAP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
  BOOTSTRAP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY}

  # The app must trace into the Langfuse project the harness reads.
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
