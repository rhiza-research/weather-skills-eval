# The eval side of a run: the dataset, the images and the app settings that
# hold secrets. The models, skill packs, connections and tracked settings come
# from the configs repo commit the batch runs.
image: ${APP_IMAGE}
runner_image: ${RUNNER_IMAGE}
# false runs the image already on the Docker host instead of pulling it.
pull: false
dataset: weather-eval-tasks
env:
  WEBUI_SECRET_KEY: ${APP_WEBUI_SECRET_KEY}
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  BOOTSTRAP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
  BOOTSTRAP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY}

  # The app must trace into the Langfuse project the harness reads.
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
